<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Miss Ilocandia 2026 - Online Voting</title>

<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:linear-gradient(135deg,#fff5fb,#f3e8ff);color:#333}
header{background:linear-gradient(135deg,#6a1b9a,#d81b60);color:white;text-align:center;padding:40px 15px}
header h1{margin:0;font-size:34px}
header p{font-size:20px;font-weight:bold}
.welcome{text-align:center;padding:25px}
.welcome h2{color:#7b1fa2}
#candidates{max-width:1200px;margin:auto;padding:10px 20px 40px;display:grid;grid-template-columns:repeat(3,1fr);gap:25px}
.candidate{background:white;border-radius:20px;padding:20px;text-align:center;box-shadow:0 8px 25px rgba(0,0,0,.15);border:2px solid #f1c6df}
.candidate h2{color:#7b1fa2;font-size:20px;margin-bottom:5px}
.location{color:#d81b60;font-weight:bold}
.photo{width:100%;height:300px;background:#eee;border-radius:15px;margin:15px 0;overflow:hidden}
.photo img{width:100%;height:100%;object-fit:cover;display:block}
.votes{font-size:17px}
.votes strong{color:#d81b60;font-size:22px}
button{width:100%;border:none;padding:14px;border-radius:30px;background:linear-gradient(135deg,#d81b60,#7b1fa2);color:white;font-size:17px;font-weight:bold;cursor:pointer}
.leaderboard{max-width:900px;margin:20px auto 50px;background:white;padding:30px;border-radius:20px;box-shadow:0 8px 25px rgba(0,0,0,.15)}
.leaderboard h2{text-align:center;color:#7b1fa2}
.rank{background:#fafafa;padding:15px;margin:10px 0;border-radius:10px;font-weight:bold}
footer{background:#6a1b9a;color:white;text-align:center;padding:25px}
@media(max-width:900px){#candidates{grid-template-columns:repeat(2,1fr)}}
@media(max-width:600px){#candidates{grid-template-columns:1fr}}
</style>
</head>

<body>

<header>
<h1>👑 LITTLE MISS ILOCANDIA 2026</h1>
<p>ONLINE VOTING</p>
</header>

<section class="welcome">
<h2>✨ SUPPORT YOUR FAVORITE CANDIDATE ✨</h2>
<p>₱1 = 1 VOTE</p>
<p>Every vote counts!</p>
</section>

<section id="candidates">
    <div class="candidate">
<h2>#15 RICCA AMADOR</h2>
<p class="location">APAYAO</p>
<div class="photo"><img src="candidate15.jpg" alt="Ricca Amador"></div>
<p class="votes">Votes: <strong id="votes15">0</strong></p>
<button onclick="vote(15)">VOTE NOW</button>
</div>

</section>

<section class="leaderboard">
<h2>🏆 CURRENT LEADERBOARD</h2>
<div id="leaderboardList">
<p style="text-align:center;">Loading latest results...</p>
</div>
</section>

<footer>
<p>© 2026 Little Miss Ilocandia | Online Voting</p>
<p>₱1 = 1 Vote</p>
</footer>
<script>
const formLink = "https://docs.google.com/forms/d/e/1FAIpQLSdYcq9Fsrg3RpFhS9v2HvxOs46MVuvRJkmtZ4TXmzvQW7QvDw/viewform?usp=pp_url";

function vote(candidate) {
    const names = {
        1:"LEONOR TAMBAN",
        2:"VANESSA CASTILLO",
        3:"NERIDA SOLIVEN",
        4:"LILY ABAN",
        5:"SHIRLEY MAE PARAGON",
        6:"LORNA AGAMOS",
        7:"SHANE FARAWE",
        8:"ELIZABETH HENDERSON",
        9:"ANA PARAN",
        10:"JOY PRINCESS ALARCON",
        11:"MARISTELLA BUENAVISTA",
        12:"GEORGIA SALVE",
        13:"TRISHA MELENDEZ",
        14:"CHLOE MATILDE CASTILLO",
        15:"RICCA AMADOR"
    };

    const selected = "Candidate #" + candidate + " – " + names[candidate];

    window.open(
        formLink + "&entry.1730127253=" + encodeURIComponent(selected),
        "_blank"
    );
}

const sheetURL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vSVG1EYCZWTFo2XHu6lfRtx61E24D_L_qkpMYHFUK8zSgfBbIHEV1qT2sZYzrI3apIgXCFJOfltCzkB/pub?gid=2100226735&single=true&output=csv";

async function updateLeaderboard() {
    try {
        const response = await fetch(sheetURL + "&t=" + Date.now());
        const csv = await response.text();

        const rows = csv.trim().split(/\r?\n/);
        let ranking = [];

        for (let i = 1; i < rows.length; i++) {
            const row = rows[i].split(",");

            if (!row[0]) continue;

            const match = row[0].match(/Candidate #(\d+)\s*[–-]\s*(.+)/);

            if (!match) continue;

            ranking.push({
                number: parseInt(match[1]),
                name: match[2].trim(),
                votes: parseInt(row[1]) || 0
            });
        }

        ranking.sort((a,b) => b.votes - a.votes);

        let html = "";

        ranking.forEach((candidate,index) => {
            let medal = "🏅";

            if(index === 0) medal = "🥇";
            if(index === 1) medal = "🥈";
            if(index === 2) medal = "🥉";

            html += `
            <div class="rank">
                ${medal} ${index + 1}. Candidate #${candidate.number}
                — ${candidate.name}
                — <strong>${candidate.votes} votes</strong>
            </div>`;
        });

        document.getElementById("leaderboardList").innerHTML =
            html || "<p style='text-align:center;'>No votes yet.</p>";

        ranking.forEach(candidate => {
            const voteElement =
                document.getElementById("votes" + candidate.number);

            if(voteElement) {
                voteElement.textContent = candidate.votes;
            }
        });

    } catch(error) {
        console.error(error);
        document.getElementById("leaderboardList").innerHTML =
            "<p style='text-align:center;color:#d81b60;'>Unable to load latest voting results.</p>";
    }
}

updateLeaderboard();
setInterval(updateLeaderboard, 10000);
</script>

</body>
</html>
